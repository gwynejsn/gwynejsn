<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 60" width="100%" height="60">
  <defs>
    <style>
      .track {
        animation: scroll 24s linear infinite;
      }
      @keyframes scroll {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-1240px); }
      }
      .badge-bg {
        fill: #111111;
        stroke: #333333;
        stroke-width: 1.5;
        rx: 6;
      }
      .badge-text {
        fill: #D4AF37;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>

  <!-- Animated Track -->
  <g class="track">
    <!-- Group 1: Original Set (Total Span: 1240px) -->
    <!-- 1. Java -->
    <g transform="translate(10, 13)">
      <rect width="80" height="34" class="badge-bg" />
      <text x="40" y="17" class="badge-text">Java</text>
    </g>
    <!-- 2. Spring Boot -->
    <g transform="translate(105, 13)">
      <rect width="115" height="34" class="badge-bg" />
      <text x="57.5" y="17" class="badge-text">Spring Boot</text>
    </g>
    <!-- 3. TypeScript -->
    <g transform="translate(235, 13)">
      <rect width="110" height="34" class="badge-bg" />
      <text x="55" y="17" class="badge-text">TypeScript</text>
    </g>
    <!-- 4. React -->
    <g transform="translate(360, 13)">
      <rect width="85" height="34" class="badge-bg" />
      <text x="42.5" y="17" class="badge-text">React</text>
    </g>
    <!-- 5. PostgreSQL -->
    <g transform="translate(460, 13)">
      <rect width="115" height="34" class="badge-bg" />
      <text x="57.5" y="17" class="badge-text">PostgreSQL</text>
    </g>
    <!-- 6. Dart -->
    <g transform="translate(590, 13)">
      <rect width="80" height="34" class="badge-bg" />
      <text x="40" y="17" class="badge-text">Dart</text>
    </g>
    <!-- 7. Flutter -->
    <g transform="translate(685, 13)">
      <rect width="90" height="34" class="badge-bg" />
      <text x="45" y="17" class="badge-text">Flutter</text>
    </g>
    <!-- 8. MongoDB -->
    <g transform="translate(790, 13)">
      <rect width="105" height="34" class="badge-bg" />
      <text x="52.5" y="17" class="badge-text">MongoDB</text>
    </g>
    <!-- 9. Flyway -->
    <g transform="translate(910, 13)">
      <rect width="90" height="34" class="badge-bg" />
      <text x="45" y="17" class="badge-text">Flyway</text>
    </g>
    <!-- 10. Mongock -->
    <g transform="translate(1015, 13)">
      <rect width="130" height="34" class="badge-bg" />
      <text x="65" y="17" class="badge-text">Mongock</text>
    </g>
    <!-- 11. Redis -->
    <g transform="translate(1160, 13)">
      <rect width="80" height="34" class="badge-bg" />
      <text x="40" y="17" class="badge-text">Redis</text>
    </g>

    <!-- Group 2: Duplicate Set (Shifted by exactly +1240px) -->
