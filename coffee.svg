<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-acc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6D1F" />
    </linearGradient>

    <radialGradient id="ambience" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes steam-rise-1 {
        0% { transform: translateY(0) scaleX(0.9); opacity: 0; }
        25% { opacity: 0.8; }
        70% { opacity: 0.35; }
        100% { transform: translateY(-40px) scaleX(1.4); opacity: 0; }
      }
      @keyframes steam-rise-2 {
        0% { transform: translateY(0) scaleX(0.8); opacity: 0; }
        30% { opacity: 0.9; }
        75% { opacity: 0.3; }
        100% { transform: translateY(-48px) scaleX(1.5); opacity: 0; }
      }
      @keyframes steam-rise-3 {
        0% { transform: translateY(0) scaleX(1); opacity: 0; }
        20% { opacity: 0.7; }
        80% { opacity: 0.2; }
        100% { transform: translateY(-36px) scaleX(1.3); opacity: 0; }
      }

      .st-1 { animation: steam-rise-1 3.2s ease-out infinite; }
      .st-2 { animation: steam-rise-2 3.8s ease-out infinite 1.1s; }
      .st-3 { animation: steam-rise-3 2.9s ease-out infinite 2.0s; }
    </style>
  </defs>

  <circle cx="80" cy="140" r="70" fill="url(#ambience)" />

  <g transform="translate(80, 150)">
    <!-- Saucer -->
    <ellipse cx="0" cy="38" rx="46" ry="11" fill="#141418" stroke="#2e2e34" stroke-width="1.5" />
    <ellipse cx="0" cy="37" rx="36" ry="7" fill="#0d0d10" stroke="#D4AF37" stroke-width="0.8" opacity="0.6" />

    <!-- Mug -->
    <path d="M -30,-12 L -24,28 C -24,36 24,36 24,28 L 30,-12 Z" fill="#16171d" stroke="#2c2d36" stroke-width="1.8" />
    
    <!-- Handle -->
    <path d="M 28,-4 C 44,-4 44,22 24,22" fill="none" stroke="#2c2d36" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 28,-4 C 44,-4 44,22 24,22" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.6" stroke-linecap="round" />

    <!-- Rim & Liquid -->
    <ellipse cx="0" cy="-12" rx="30" ry="8" fill="#1b1c23" stroke="#D4AF37" stroke-width="1.4" />
    <ellipse cx="0" cy="-11" rx="26" ry="6.5" fill="#2d1c0b" />
    <ellipse cx="0" cy="-11" rx="18" ry="4.5" fill="#422910" />

    <!-- Motif -->
    <line x1="0" y1="2" x2="0" y2="28" stroke="#D4AF37" stroke-width="1.5" opacity="0.7" stroke-linecap="round" />
    <circle cx="0" cy="15" r="2.5" fill="#D4AF37" />

    <!-- Steam -->
    <g filter="url(#glow)">
      <path d="M -9,-20 Q -18,-35 -8,-50 Q 2,-65 -6,-80" fill="none" stroke="#FFF2A3" stroke-width="1.8" stroke-linecap="round" class="st-1" />
      <path d="M 0,-22 Q 10,-38 -2,-56 Q -14,-74 0,-92" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" class="st-2" />
      <path d="M 9,-20 Q 18,-34 10,-48 Q 2,-62 12,-76" fill="none" stroke="#FFF2A3" stroke-width="1.6" stroke-linecap="round" class="st-3" />
    </g>
  </g>
</svg>
